name: Takvimleri güncelle

on:
  schedule:
    - cron: "43 * * * *"    # her saat (43. dakikada)
  workflow_dispatch:         # Actions sekmesinden elle çalıştırma
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  guncelle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: .ics dosyalarını üret
        run: python3 milli_takvim.py
      - name: Değişiklik varsa kaydet
        if: always()   # bir takvimin kaynağı çalışmasa da diğer takvim kaydedilsin
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/*.ics
          # DTSTAMP her çalıştırmada değişir; sadece maç bilgisi değiştiyse commit at
          if git diff --cached -U0 | grep '^[+-][A-Z]' | grep -qv '^[+-]DTSTAMP'; then
            git commit -m "Fikstürü güncelle"
            git push
          else
            echo "Fikstürde değişiklik yok."
          fi
